[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = 'ezgb'
version = '0.1.1'
description = 'A standalone Python library for working with git-bug repositories'
readme = 'README.md'
requires-python = '>=3.9'
dependencies = ['pygit2']
license = 'GPL-2.0-or-later'
license-files = ['COPYING']
authors = [
    { name = 'Konstantin Ryabitsev', email = 'konstantin@linuxfoundation.org' }
]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Environment :: Console',
    'Intended Audience :: Developers',
    'Programming Language :: Python :: 3 :: Only',
    'Topic :: Software Development :: Bug Tracking',
    'Topic :: Software Development :: Version Control :: Git',
]

[dependency-groups]
dev = [
    "mypy",
    "pyright",
    "pytest",
    "ruff",
    "ty",
]

[project.urls]
'Homepage' = 'https://git.kernel.org/pub/scm/utils/ezgb/ezgb.git/'
'Source' = 'https://git.kernel.org/pub/scm/utils/ezgb/ezgb.git'
'Community' = 'https://lore.kernel.org/tools'

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.mypy]
strict = true

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
# pyright automatically ignores virtual environments and other directories,
# but once we specify `exclude`, we're on our own. ".venv-*" catches the
# per-interpreter venvs that ci-matrix.sh leaves behind (without them,
# pyright tries to type-check every package in each one).
exclude = [".venv", ".venv-*"]
typeCheckingMode = "strict"

# pygit2 ships no type information, so member/variable/argument types coming
# out of it resolve to Unknown. Relax the strict "unknown type" reports
# rather than sprinkling casts across every git-object access site.
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false

# False positives caused by underscore-prefixed helpers used across modules.
reportPrivateUsage = false

[tool.ty.rules]
all = "error"
